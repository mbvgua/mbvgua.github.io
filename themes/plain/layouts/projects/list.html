{{ define "main" }}
  <div class="nav"  >
    {{ partial "back_link.html" . }}
  </div>

  <h2> Project List </h2>

  <div>
    {{ range (where .Site.RegularPages "Section" "projects").ByParam "sort" }}
      <dl>
        <dt style="text-transform: capitalize;">
          <h3> <a href="{{ .RelPermalink }}">{{ .Title }}</a> </h3>
        </dt>
        <dd style="color:#75715e">
          {{ .Description | markdownify }}
        </dd>
      </dl>
    {{ end }}
  </div>
{{ end }}
