baseURL = "https://example.org/"
locale = "en-us"
title = "Mbugua's Blog"
theme = "plain"
enableGitInfo = true

[params]
  description = "My corner on the internet"
  shortName = "Mbugua's Blog"
  # shortName = "Blisters & Bugs"
  [params.author]
    name = "Mbugua"
    email = "mbvgua+dev@gmail.com"
  [params.theme_config]
    appearance        = "auto"
    back_home_text    = ".."
    date_format       = "2006-01-02"
    isListGroupByDate = false
    isShowFooter      = true

[taxonomies]
  category = "categories"
  tag = "tags"
  author = "authors"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true
