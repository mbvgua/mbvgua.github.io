---
layout: default
---

<header>
  <header class="hero">
    <h1 class="hero-title">{{ site.title }}</h1>
    <p class="hero-tagline">{{ site.tagline | join: " &bull; " }}</p>
  </header>

  {%-if site.theme_config.show_description-%}
  <p>{{ site.description }}</p>
  {%-endif-%}
</header>

{{ content }} {%-include menu_item.html collection=site.data.menu.entries-%}
